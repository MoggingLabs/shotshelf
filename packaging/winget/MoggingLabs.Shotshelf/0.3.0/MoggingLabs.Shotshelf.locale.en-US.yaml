ShortDescription: The shelf that catches every capture.
Description: >-
  A local-only desktop shelf that watches the OS screenshot and recording
  folders, catches every capture the moment it lands, and keeps it one drag
  away — with on-device text recognition, a credential warning before you
  send a token in a screenshot, an annotation editor with real redaction,
  and a full keyboard map. No accounts, no cloud; the only network call is
  an optional update check.
