name: Release

# Builds the installers on all three OSes. This is the only way to produce a
# macOS .dmg without a Mac to hand, and on Windows it sidesteps Smart App
# Control, which blocks freshly built unsigned binaries on locked-down machines.
#
# Linux is in the matrix as a **smoke build, not a shipped one** — its
# artifact is prefixed `linux-smoke` and the publish job's `shotshelf-*`
# pattern never picks it up. The reasoning, so the next person weighs it
# rather than rediscovering it: no human has ever run Shotshelf on a Linux
# desktop, and the platform's known degradations stack on the way *in* — the
# tray protocol delivers no click events, and the global shortcut can report
# success under pure Wayland without the OS taking the key. Installed blind,
# a Wayland user could hide the shelf once and never summon it again. An
# installer download asserts "this works"; a smoke build only asserts "this
# still bundles", which keeps the packaging path from being unexecuted code —
# the same reason this workflow runs weekly at all. The flip condition is one
# person running docs/PARITY.md's smoke checklist on a real Linux desktop;
# after that, moving the artifact prefix is the whole change.
#
# Signing material comes from repository secrets. With none set the build still
# succeeds and produces UNSIGNED artifacts — useful for checking the bundle,
# useless for handing to a teammate.

# The weekly run is a smoke test, not a release.
#
# `SECURITY.md` records that no installer has ever been built on any machine:
# this workflow fired on `v*` tags, of which there are none, and on manual
# dispatch, which had never been run. `ci.yml` runs `cargo build` and never
# `tauri build`, so the entire bundling path — `scripts/build-release.mjs`, the
# sidecar, NSIS/MSI/DMG generation, updater artifacts — was unexecuted code.
# The first time anyone ran it would have been the day it was needed.
#
# A schedule is the cheapest way to stop that being true. It costs three
# runners a week and it fails on the Monday the bundler breaks rather than on the
# afternoon someone is trying to ship. Deliberately not on every push to main:
# a full release build on two OSes is far more runner time than the change
# rate here justifies, and `ci.yml` already covers whether the code compiles.
# The paragraph above predates the fix and is kept as the reason the schedule
# exists; installers have been built since 2026-08-01 and v0.1.0 shipped.
on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # A release build is the gate plus a full optimised Tauri bundle, so this is
    # roomier than `ci.yml`'s. It is still a ceiling rather than an estimate:
    # the default is six hours, and a bundler waiting on a notarization service
    # that never answers would sit there for all of them.
    timeout-minutes: 90
    # Promoted to a job-level env var because `secrets` is **not** among the
    # contexts available to a step's `if:` — GitHub's context table lists
    # github, needs, strategy, matrix, job, runner, env, vars, steps and inputs,
    # and nothing else. `if: ${{ secrets.X != '' }}` therefore either fails the
    # workflow outright or silently never runs; either way the signature check
    # below, which is the only thing in the repo that notices a configured key
    # producing no `.sig`, was not a check at all. `env` *is* available, so this
    # is the shape GitHub's own secrets guide prescribes.
    #
    # A *boolean*, not the key. Job-level `env` applies to every step, so
    # putting the minisign private key here would hand it to `npm ci` — which
    # runs `postinstall` and every lifecycle script in the dependency tree — and
    # to `npm run gate`, where every crate's `build.rs` and proc-macro runs with
    # the full environment. The comparison happens here, once; only `'true'` or
    # `'false'` travels. `TAURI_SIGNING_PRIVATE_KEY` itself still reaches the
    # bundler alone, through the step-level `env` block.
    env:
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            # `shotshelf-*` is what the publish job downloads; only artifacts
            # carrying this prefix can reach a Release.
            prefix: shotshelf
            artifacts: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/msi/*.msi.sig
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/nsis/*.exe.sig
          - os: macos-latest
            name: macOS
            prefix: shotshelf
            artifacts: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app.tar.gz
              src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          - os: ubuntu-latest
            name: Linux
            # Deliberately NOT `shotshelf` — see the header. Renaming this to
            # `shotshelf` is the one-line act of shipping Linux, and it is owed
            # a smoke run on a real desktop first.
            prefix: linux-smoke
            artifacts: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.AppImage.sig

    steps:
      - uses: actions/checkout@v7

      # The same list ci.yml installs, plus nothing: the bundler's extra tools
      # (linuxdeploy for the AppImage) are fetched by Tauri itself, and the
      # FUSE those tools would otherwise need is sidestepped by
      # APPIMAGE_EXTRACT_AND_RUN on the bundle step below.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential

      # The tag is the fourth place the version is written, and the only one
      # outside the repo.
      #
      # `src/version.test.ts` joins the three in-repo literals to each other and
      # is blind to this one, so `git tag v0.2.0` on a tree at 0.1.0 built
      # artifacts named `Shotshelf_0.1.0_…` under a `0.2.0` release. An operator
      # following README's manifest example then publishes a `0.2.0` URL that
      # 404s for every Windows client — or points it at the 0.1.0 file, in which
      # case `{{current_version}}` never advances and the update is re-offered
      # for ever.
      #
      # Compared against `tauri.conf.json` alone, deliberately: that is the
      # literal the bundle is named with, and the unit test already guarantees
      # the other two agree with it. Checking all three here would be a second
      # copy of a rule that has an owner.
      #
      # Before the gate, because it costs a second and the gate costs minutes.
      - name: Check the tag matches the shipping version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          shipping=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$shipping" != "$tagged" ]; then
            echo "::error::tag $GITHUB_REF_NAME ships version $shipping." \
                 "Bump tauri.conf.json (and let src/version.test.ts check the rest)," \
                 "or retag."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches the shipping version $shipping."

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # postinstall fetches the ffmpeg sidecar for this platform.
      - name: Install frontend dependencies
        run: npm ci

      # The toolchain, before the gate rather than after it.
      #
      # `npm run gate` runs `cargo fmt --check`, `clippy -D warnings`,
      # `cargo test` and `cargo build`. With these two steps below the gate, all
      # four ran on whatever Rust the runner image happened to ship, uncached —
      # a different compiler from the one `ci.yml` checks with and from the one
      # that goes on to build the bundle a few steps later.
      - uses: dtolnay/rust-toolchain@stable
        # Asked for rather than assumed. The gate's first two commands are
        # `cargo fmt --check` and `cargo clippy`, this action installs with
        # `--profile minimal`, and only the runner image happening to
        # preinstall them made it work. `ci.yml` already spells it out.
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The gate, before anything is bundled.
      #
      # This workflow triggers on a `v*` tag and `ci.yml` does not — so a tag
      # on a red commit built and "released" it, with no lint, no tests and no
      # clippy anywhere in the path. A release is the one build that must not
      # be the unchecked one.
      #
      # One part of it is a no-op here, and deliberately: the pixel goldens in
      # `tests/visual/appearance.spec.ts` skip on anything but Linux — font
      # rasterisation differs between platforms — and there is no Linux runner
      # in this matrix, because there is no Linux artifact to build. Appearance
      # is gated by `ci.yml`, which does run on `ubuntu-latest`, on the same
      # commit. Worth knowing rather than assuming this run covers it.
      - name: Gate
        run: |
          npx playwright install chromium --with-deps
          npm run gate

      - name: Build frontend
        run: npm run build

      - name: Bundle installers
        run: npm run release
        env:
          # The AppImage tooling is itself shipped as AppImages, and the
          # GitHub runners have no FUSE; this makes the tools self-extract
          # instead. Ignored everywhere but Linux.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # Absent secrets simply mean "don't sign"; the build script says so.
          WINDOWS_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # A release with signing configured but broken must not look like a good
      # one.
      #
      # `if-no-files-found: error` checks the *aggregate*, so it cannot see
      # this: with a typo'd or expired key, `build-release.mjs` never sets
      # `createUpdaterArtifacts`, Windows still uploads two installers and macOS
      # still uploads a `.dmg` — the job goes green having produced no updater
      # payload and no signature at all. Nothing else in the repo checks that a
      # `.sig` exists.
      #
      # Conditional on the secret, because an unsigned build is a supported and
      # documented outcome. The failure being caught is "you meant to sign and
      # did not", which is silent in every other signal.
      - name: Check the signed artifacts were actually signed
        if: env.HAS_SIGNING_KEY == 'true'
        shell: bash
        run: |
          signatures=$(find src-tauri/target/release/bundle -type f -name '*.sig' | wc -l)
          if [ "$signatures" -eq 0 ]; then
            echo "::error::a signing key is configured but no .sig was produced." \
                 "The updater payload would be unusable; check the key and its password."
            exit 1
          fi
          echo "Produced $signatures signature(s)."

      # Proves the sidecar actually made it inside, rather than only into the
      # build directory — a bundle without ffmpeg still runs, it just silently
      # stops making poster frames.
      - name: List what was produced
        shell: bash
        run: |
          echo "--- bundle tree ---"
          find src-tauri/target/release/bundle -type f \
            \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.sig' -o -name '*.tar.gz' \) \
            -exec ls -lh {} \;
          echo "--- ffmpeg alongside the binary ---"
          find src-tauri/target/release -maxdepth 1 -name 'ffmpeg*' -exec ls -lh {} \;

      # Named with the ref, so a hand-dispatched build cannot be mistaken for a
      # tagged release.
      #
      # `workflow_dispatch` runs from a branch, where `github.ref_type` is
      # `branch`, so the tag-vs-version check above is skipped — correctly,
      # since there is no tag to check. What was wrong is that the result was
      # then indistinguishable: the artifact was `shotshelf-windows-latest`
      # either way, with no ref and no version anywhere in the name.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.prefix }}-${{ matrix.os }}-${{ github.ref_name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  # A tag becomes a GitHub Release people can actually download from.
  #
  # Workflow artifacts require a signed-in GitHub account and expire; handing a
  # teammate an installer means handing them a URL that works. Only on tags —
  # the weekly schedule and hand dispatches stay smoke tests whose output lives
  # and dies as artifacts — and with `contents: write` scoped to this one job,
  # not the workflow: the bundle job runs `npm ci` and the whole gate, and none
  # of that code needs a token that can write to the repository.
  publish:
    name: Publish the release
    needs: bundle
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: shotshelf-*
          merge-multiple: true
          path: dist

      # The artifacts keep their `src-tauri/target/…` directory shape; a
      # Release wants flat files with a checksum list alongside. Checksums are
      # what let an unsigned internal build be verified at all — no signature
      # means the SHA256 is the only integrity statement there is.
      - name: Flatten and checksum
        working-directory: dist
        run: |
          find . -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \
            -o -name '*.tar.gz' -o -name '*.sig' \) -exec mv {} . \;
          find . -mindepth 1 -type d -exec rm -rf {} + 2>/dev/null || true
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The update feed, when there is one to publish.
      #
      # `tauri.conf.json` points every installed app at the release feed URL
      # (`https://github.com/MoggingLabs/shotshelf/releases/latest/download/latest.json`)
      # — this is the step that puts that file there. It exists only when the bundles were signed for the
      # updater: no `.sig` means no `TAURI_SIGNING_PRIVATE_KEY` is configured,
      # every installed app would reject the payload anyway, and publishing a
      # manifest for artifacts nothing can verify would turn the quiet 404
      # today's apps see into a loud failure. Skipping is the honest state.
      #
      # The platform keys and the macOS artifact name follow the bundler, not
      # taste: `<product>.app.tar.gz` carries no version and no arch — an
      # earlier README example invented a versioned name and every macOS
      # client got a 404. Release-asset URLs are stable per tag, so nothing
      # here overwrites anything.
      - name: Compose latest.json
        working-directory: dist
        run: |
          if ! ls *.sig >/dev/null 2>&1; then
            echo "no updater key configured — no latest.json (installers only)"
            exit 0
          fi
          node -e '
            const fs = require("fs");
            const tag = process.env.GITHUB_REF_NAME;
            const repo = process.env.GITHUB_REPOSITORY;
            const url = (file) =>
              `https://github.com/${repo}/releases/download/${tag}/${encodeURIComponent(file)}`;
            const sig = (file) => fs.readFileSync(`${file}.sig`, "utf8").trim();
            const platforms = {};
            const exe = fs.readdirSync(".").find((f) => f.endsWith("-setup.exe"));
            if (exe && fs.existsSync(`${exe}.sig`)) {
              platforms["windows-x86_64"] = { signature: sig(exe), url: url(exe) };
            }
            const mac = fs.readdirSync(".").find((f) => f.endsWith(".app.tar.gz"));
            if (mac && fs.existsSync(`${mac}.sig`)) {
              platforms["darwin-aarch64"] = { signature: sig(mac), url: url(mac) };
            }
            if (Object.keys(platforms).length === 0) {
              console.log("signatures present but no recognised updater artifact — not publishing a manifest");
              process.exit(0);
            }
            const manifest = {
              version: tag.replace(/^v/, ""),
              pub_date: new Date().toISOString(),
              platforms,
            };
            fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2));
            console.log(fs.readFileSync("latest.json", "utf8"));
          '

      - name: Create the GitHub Release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md << 'EOF'
          Built by the release workflow from this tag, with the full gate run
          on both bundling platforms first.

          **Signing status is stated per artifact era, not assumed.** If no
          `.sig` files are attached, this build is **unsigned**: Windows will
          show SmartScreen warnings (and machines enforcing Smart App Control
          will refuse it entirely), and macOS requires right-click → Open the
          first time. `SHA256SUMS.txt` is the integrity statement — verify a
          download against it before installing.

          What has and has not been verified on each OS is `docs/PARITY.md`,
          and what the app does and never does is `SECURITY.md` — local-only,
          one update-check request, captures never leave the machine.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Shotshelf $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag \
            *.msi *.exe SHA256SUMS.txt \
            $(ls *.dmg *.tar.gz *.sig latest.json 2>/dev/null || true)
