name: Release

# Builds the installers on both target OSes. This is the only way to produce a
# macOS .dmg without a Mac to hand, and on Windows it sidesteps Smart App
# Control, which blocks freshly built unsigned binaries on locked-down machines.
#
# Signing material comes from repository secrets. With none set the build still
# succeeds and produces UNSIGNED artifacts — useful for checking the bundle,
# useless for handing to a teammate.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            artifacts: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/msi/*.msi.sig
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/nsis/*.exe.sig
          - os: macos-latest
            name: macOS
            artifacts: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app.tar.gz
              src-tauri/target/release/bundle/macos/*.app.tar.gz.sig

    steps:
      - uses: actions/checkout@v7

      # The tag is the fourth place the version is written, and the only one
      # outside the repo.
      #
      # `src/version.test.ts` joins the three in-repo literals to each other and
      # is blind to this one, so `git tag v0.2.0` on a tree at 0.1.0 built
      # artifacts named `Shotshelf_0.1.0_…` under a `0.2.0` release. An operator
      # following README's manifest example then publishes a `0.2.0` URL that
      # 404s for every Windows client — or points it at the 0.1.0 file, in which
      # case `{{current_version}}` never advances and the update is re-offered
      # for ever.
      #
      # Compared against `tauri.conf.json` alone, deliberately: that is the
      # literal the bundle is named with, and the unit test already guarantees
      # the other two agree with it. Checking all three here would be a second
      # copy of a rule that has an owner.
      #
      # Before the gate, because it costs a second and the gate costs minutes.
      - name: Check the tag matches the shipping version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          shipping=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$shipping" != "$tagged" ]; then
            echo "::error::tag $GITHUB_REF_NAME ships version $shipping." \
                 "Bump tauri.conf.json (and let src/version.test.ts check the rest)," \
                 "or retag."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches the shipping version $shipping."

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # postinstall fetches the ffmpeg sidecar for this platform.
      - name: Install frontend dependencies
        run: npm ci

      # The gate, before anything is bundled.
      #
      # This workflow triggers on a `v*` tag and `ci.yml` does not — so a tag
      # on a red commit built and "released" it, with no lint, no tests and no
      # clippy anywhere in the path. A release is the one build that must not
      # be the unchecked one.
      - name: Gate
        run: |
          npx playwright install chromium --with-deps
          npm run gate

      - name: Build frontend
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Bundle installers
        run: npm run release
        env:
          # Absent secrets simply mean "don't sign"; the build script says so.
          WINDOWS_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Proves the sidecar actually made it inside, rather than only into the
      # build directory — a bundle without ffmpeg still runs, it just silently
      # stops making poster frames.
      - name: List what was produced
        shell: bash
        run: |
          echo "--- bundle tree ---"
          find src-tauri/target/release/bundle -type f \
            \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.sig' -o -name '*.tar.gz' \) \
            -exec ls -lh {} \;
          echo "--- ffmpeg alongside the binary ---"
          find src-tauri/target/release -maxdepth 1 -name 'ffmpeg*' -exec ls -lh {} \;

      - uses: actions/upload-artifact@v7
        with:
          name: shotshelf-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
