[package]
name = "shotshelf"
version = "0.1.0"
description = "The shelf that catches every capture."
authors = ["MoggingLabs"]
license = "MIT"
repository = "https://github.com/MoggingLabs/shotshelf"
edition = "2021"

[lib]
# Tauri v2 keeps the app in a library so the binary stays a one-line entry point.
name = "shotshelf_lib"
#
# `rlib` only. The Tauri template ships `["staticlib", "cdylib", "rlib"]` for
# its mobile targets, and this project has none: no `gen/apple`, no
# `gen/android`, no mobile entry point, and `main.rs` links the rlib. The
# other two were built by every `cargo build` in the gate for nothing —
# a 1.45 GB static archive and a DLL that nothing loads. They were also the
# red herring `webview_path.rs` spent a paragraph retracting. Add them back
# with the mobile target that needs them, not before.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon`         -> the menu-bar / system-tray icon
# `image-png`         -> load the macOS template tray glyph at compile time
# `macos-private-api` -> required for a transparent window on macOS
# `protocol-asset`    -> lets the webview render capture files off disk (phase 03);
#                        must stay in step with `app.security.assetProtocol`
tauri = { version = "2", features = [
  "tray-icon",
  "image-png",
  "macos-private-api",
  "protocol-asset",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Adopted plugins (the research behind these is kept locally and is not in the repo) — registered in src/lib.rs ──
tauri-plugin-clipboard = "2"                                      # clipboard images (phase 02)
tauri-plugin-drag = "2"                                           # native drag-out (phase 04)
tauri-plugin-shell = "2"                                          # runs the bundled ffmpeg sidecar
tauri-plugin-global-shortcut = "2"                                # show/hide hotkey (phase 06)
tauri-plugin-updater = "2"                                        # asks the internal feed whether a newer build exists; installs nothing
window-vibrancy = "0.8"                                           # acrylic / vibrancy behind the popover
tauri-plugin-single-instance = "2"                                # one shelf, one catcher

# Folder watching for the catch engine: https://github.com/notify-rs/notify
# The debouncer is notify-rs' own, so we don't hand-roll event coalescing.
notify = "8"
notify-debouncer-full = "0.7"

# Pixel work: downscaling a capture for hand-off, and diffing a before against
# an after.
#
# The narrowing is a statement of intent, not an effective one, and saying so
# here is the point: `tauri` itself depends on `image` with default features,
# and Cargo unifies features across the graph, so `cargo tree -f "{p} | {f}"`
# resolves the full default set — avif, bmp, gif, tiff and the rest — however
# this line is written. The compile time is paid either way.
#
# Kept because it is the correct declaration of what Shotshelf meets (PNG, JPEG
# and WebP) and it becomes effective the day Tauri narrows its own. The claim it
# used to make — that this saved compile time for decoders nothing calls — was
# measurably false, and it is worth knowing that `imaging::load` will in fact
# decode considerably more than these three.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# Secret detection over recognised text. Hand-rolling this many patterns would
# be a worse bet than a well-tested engine, and `regex` guarantees linear time,
# so a pathological screenshot cannot hang the catch pipeline.
regex = "1"

# Just the semaphore, to keep a burst of tiles from becoming a burst of OCR
# engines. Tauri already runs on tokio, so this is the runtime already present.
tokio = { version = "1", default-features = false, features = ["sync", "time"] }

# The frontmost application's name, which needs no permission at all — unlike
# its window title, which on macOS needs Screen Recording. See enrich/foreground.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSWorkspace",
    "NSRunningApplication",
] }

# Text recognition, the same engine Preview and Quick Look use. Needs no
# permission and no network — see enrich/ocr.
objc2-vision = { version = "0.3", default-features = false, features = [
    "std",
    "VNRequest",
    "VNRecognizeTextRequest",
    "VNObservation",
    "VNRequestHandler",
    "VNTypes",
] }
# The runtime itself, for the `AnyThread` trait that provides `alloc`.
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSArray",
    "NSURL",
    "NSError",
] }

# Rounded window corners, which CSS cannot deliver on its own — see
# `window::round_corners`. Same version Tauri already depends on, so this only
# turns on an extra feature rather than pulling a second copy of the crate.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",   # rounded window corners
    "Media_Ocr",            # the OS text recogniser
    "Win32_UI_WindowsAndMessaging", # which window was in front
    "Win32_System_Threading",       # and which program owns it
    "Graphics_Imaging",     # decoding a capture for it
    "Storage_Streams",      # feeding it bytes without going through StorageFile
    "Globalization",        # it follows the user's own language list
] }

