# Which directory root a path comes from is a privacy decision, not a filing
# one — see `src-tauri/src/dirs.rs`. On Windows `app_config_dir` and `app_data_dir` are
# the same directory (the roaming profile, copied to a network share at logoff
# under Enterprise State Roaming), and a capture's path names client and
# project work as readily as a window title does.
#
# `dirs.rs` is the one module allowed to resolve a root, so the rule is stated
# once. Clippy matches on the resolved path, which is what makes this stronger
# than the substring scan in `scripts/check-dirs.mjs`: it sees UFCS and renamed
# imports too.
#
# `BaseDirectory` is listed as a disallowed *type* rather than left to the
# script. The script matched the literal text `BaseDirectory::`, which one
# import alias defeated — it matches the bare name now, and catches this too,
# but clippy is the one that resolves the path rather than the spelling:
#
#     use tauri::path::BaseDirectory as Roaming;
#     app.path().resolve("pinned.json", Roaming::AppData)
#
# That reaches the roaming profile with the script reporting success, because
# the string never appears. Clippy resolves paths, so the alias is the same type
# and it fires either way. Both files used to claim the other covered this;
# neither did.
#
# The script still runs, and still covers what clippy cannot: it reads files
# rustc never compiles — a module not yet declared in `lib.rs`, or one behind a
# `cfg` for another OS.
#
# `src-tauri/src/dirs.rs` carries `#![allow(clippy::disallowed_methods)]`. It
# needs no `disallowed_types` allowance: it resolves roots by calling the
# `PathResolver` functions and never names `BaseDirectory`.
disallowed-methods = [
  { path = "tauri::path::PathResolver::app_data_dir", reason = "roaming; go through `dirs::preferences`" },
  { path = "tauri::path::PathResolver::app_config_dir", reason = "roaming; go through `dirs::preferences`" },
  { path = "tauri::path::PathResolver::app_local_data_dir", reason = "go through `dirs::local`" },
  { path = "tauri::path::PathResolver::app_cache_dir", reason = "go through `dirs::cache`" },
  # The roaming root itself, not just the Tauri functions under it.
  #
  # `check-dirs.mjs` holds this to one caller by matching the text
  # `dirs::preferences`, which `use crate::dirs as roots; roots::preferences(app)`
  # walks straight past — a reviewer wrote a capture path into the roaming
  # profile that way with both gates green, which is the one thing SECURITY.md
  # promises cannot happen. Clippy resolves the path, so the alias is the same
  # function.
  { path = "shotshelf_lib::dirs::preferences", reason = "the roaming profile: only `settings.rs` may, and only for settings" },
]

disallowed-types = [
  { path = "tauri::path::BaseDirectory", reason = "resolves a root without naming it; go through `dirs`" },
]
