<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shotshelf</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- The shelf is a frameless widget: this strip is its only title bar, and
         `data-tauri-drag-region` is what makes it draggable without decorations. -->
    <div class="shelf">
      <header class="shelf__bar" data-tauri-drag-region>
        <span class="shelf__mark" id="shelf-mark" data-tauri-drag-region></span>
        <span class="shelf__title" id="shelf-count" data-tauri-drag-region>Shelf</span>
        <span class="shelf__grow" data-tauri-drag-region></span>
        <!-- Marking up needs exactly one capture to mark up. -->
        <button
          class="shelf__btn shelf__btn--compare"
          id="shelf-edit"
          type="button"
          title="Mark up this capture"
          hidden
        >
          Edit
        </button>
        <!-- Only earns its place when exactly two captures are picked: a
             comparison of one thing, or of five, is not a thing. -->
        <button
          class="shelf__btn shelf__btn--compare"
          id="shelf-compare"
          type="button"
          title="Compare the two picked captures"
          hidden
        >
          Compare
        </button>
        <button class="shelf__btn" id="shelf-settings" type="button" title="Settings">
          <span class="sr-only">Settings</span>
        </button>
        <button class="shelf__btn" id="shelf-hide" type="button" title="Hide the shelf — the tray icon brings it back">
          <span class="sr-only">Hide shelf</span>
        </button>
      </header>

      <section class="settings" id="settings-panel" hidden>
        <label class="settings__row">
          <span>Keep for</span>
          <select id="setting-retention">
            <option value="">Forever</option>
            <option value="1">1 hour</option>
            <option value="8">8 hours</option>
            <option value="24">24 hours</option>
          </select>
        </label>
        <label class="settings__row">
          <span>Max items</span>
          <input id="setting-max" type="number" min="1" max="200" step="1" />
        </label>
        <label class="settings__row">
          <span
            title="Vision models resize what they are given to about 1568px anyway, so this costs nothing when you are feeding a chat. Off by default because a drag-out also feeds design tools and bug reports."
            >Send smaller copies</span
          >
          <input id="setting-downscale" type="checkbox" />
        </label>
        <label class="settings__row">
          <span>Hotkey</span>
          <input id="setting-hotkey" type="text" spellcheck="false" autocomplete="off" />
        </label>
        <!-- The option values are the exact strings Rust's DOCK_CORNERS /
             DOCK_MONITORS accept — anything else is normalised back to the
             default by `sanitise`, and the e2e drives every option through the
             real save to keep the two lists honest. -->
        <label class="settings__row">
          <span>Corner</span>
          <select id="setting-corner">
            <option value="bottom-right">Bottom right</option>
            <option value="bottom-left">Bottom left</option>
            <option value="top-right">Top right</option>
            <option value="top-left">Top left</option>
          </select>
        </label>
        <label class="settings__row">
          <span>Monitor</span>
          <select id="setting-monitor">
            <option value="primary">Primary</option>
            <option value="cursor">Where my cursor is</option>
          </select>
        </label>
        <label class="settings__row">
          <span
            title="Registers Shotshelf as a login item so it is already watching when you take the day's first capture. The choice follows your account; turning it off unregisters this machine."
            >Start at login</span
          >
          <input id="setting-autostart" type="checkbox" />
        </label>
        <p class="settings__note" id="settings-note"></p>
        <p class="settings__hint">Pinned captures ignore “Keep for” and come back after a restart.</p>
      </section>

      <!-- The list and the overlay share one box, and that box is what the
           overlay is allowed to cover. Both halves of that are load-bearing.

           The overlay is a *sibling* of #shelf-items rather than a child:
           that element is rebuilt wholesale on every render, so a capture
           landing mid-annotation used to remove the editor from under the
           user while the module still held a pointer to the detached node.

           And it is a sibling *inside this wrapper* rather than inside
           .shelf: stretched across the whole panel it covered the title
           strip — the only drag handle a frameless window has, plus Hide and
           Settings — and painted over the alert strip that reports the
           editor's own failed saves. -->
      <div class="shelf__body">
        <main class="shelf__items" id="shelf-items" data-empty="true"></main>
        <div class="shelf__overlay" id="shelf-overlay"></div>
      </div>

      <!-- Only appears when something actually needs saying. -->
      <p class="shelf__alert" id="shelf-alert" hidden></p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
