<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shotshelf</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- The shelf is a frameless widget: this strip is its only title bar, and
         `data-tauri-drag-region` is what makes it draggable without decorations. -->
    <div class="shelf">
      <header class="shelf__bar" data-tauri-drag-region>
        <!-- A button, not a span: its tooltip is the app's primary diagnostic
             (the watch list, the clipboard state, the credential note), and an
             8px mouse-only dot made that unreachable by keyboard entirely.
             `status.ts` keeps the aria-label in step with the tooltip. -->
        <button class="shelf__mark" id="shelf-mark" type="button" aria-label="Watch status"></button>
        <span class="shelf__title" id="shelf-count" data-tauri-drag-region>Shelf</span>
        <span class="shelf__grow" data-tauri-drag-region></span>
        <!-- Marking up needs exactly one capture to mark up. -->
        <button
          class="shelf__btn shelf__btn--compare"
          id="shelf-edit"
          type="button"
          data-tip="Mark up this capture (E)"
          hidden
        >
          Edit
        </button>
        <!-- Only earns its place when exactly two captures are picked: a
             comparison of one thing, or of five, is not a thing. -->
        <button
          class="shelf__btn shelf__btn--compare"
          id="shelf-compare"
          type="button"
          data-tip="Compare the two picked captures"
          hidden
        >
          Compare
        </button>
        <button
          class="shelf__btn"
          id="shelf-settings"
          type="button"
          data-tip="Settings"
          aria-label="Settings"
        ></button>
        <!-- The hairline keeps Settings and Hide from reading as twins: two
             identical muted icon buttons 8px apart, with the dismissive one
             outermost, was a measured mis-click. -->
        <span class="shelf__sep" aria-hidden="true"></span>
        <button
          class="shelf__btn"
          id="shelf-hide"
          type="button"
          data-tip="Hide the shelf — the tray icon brings it back (Esc)"
          aria-label="Hide the shelf — the tray icon brings it back (Esc)"
        ></button>
      </header>

      <!-- Settings live in their own window now — `open_settings`, wired to
           the gear. The panel that used to sit here squeezed seven controls
           into 225px; its whole surface moved to settings.html. -->

      <!-- The list and the overlay share one box, and that box is what the
           overlay is allowed to cover. Both halves of that are load-bearing.

           The overlay is a *sibling* of #shelf-items rather than a child:
           that element is rebuilt wholesale on every render, so a capture
           landing mid-annotation used to remove the editor from under the
           user while the module still held a pointer to the detached node.

           And it is a sibling *inside this wrapper* rather than inside
           .shelf: stretched across the whole panel it covered the title
           strip — the only drag handle a frameless window has, plus Hide and
           Settings — and painted over the alert strip that reports the
           editor's own failed saves. -->
      <div class="shelf__body">
        <main class="shelf__items" id="shelf-items" data-empty="true"></main>
        <div class="shelf__overlay" id="shelf-overlay"></div>
      </div>

      <!-- Only appears when something actually needs saying. `role="status"`
           because this is the single channel every failure in the app reports
           through, and without a live region none of it was ever announced. -->
      <p class="shelf__alert" id="shelf-alert" role="status" hidden></p>

      <!-- The delete toast. Unlike the alert strip above, this one acts: the
           whole strip is the Undo button, because a small link inside a
           sentence is a target nobody hits in the twelve seconds they have.
           `role="status"` for the same announcement reasoning as the alert. -->
      <button class="shelf__undo" id="shelf-undo" type="button" role="status" hidden></button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
